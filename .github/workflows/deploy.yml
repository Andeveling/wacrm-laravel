name: deploy

# El VPS de pruebas se actualiza solo desde develop. main no dispara deploy.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Solo siembra el primer .env. Después el .env del VPS manda.
  APP_URL: https://wacrm.andeveling.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Construye vendor (sin dev) y assets acá, no en la VPS de 1GB.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, gd, sockets, pcntl, mbstring, xml, zip
          tools: composer:v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install PHP dependencies (production)
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm build

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -rlptDz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            --exclude '.git' --exclude '.github' --exclude '.env*' \
            --exclude 'node_modules' --exclude 'storage' --exclude 'bootstrap/cache' \
            --exclude 'docs' --exclude 'skills' --exclude 'tools' --exclude 'tests' \
            --exclude '.agents' --exclude '.atl' --exclude '.codegraph' \
            --exclude '.commandcode' --exclude '.engram' --exclude '.pi' \
            --exclude '.pnpm-store' \
            ./ "$USER@$HOST:/var/www/wacrm/"
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "cd /var/www/wacrm && APP_URL='$APP_URL' DB_PASSWORD='$DB_PASSWORD' bash scripts/deploy.sh"
