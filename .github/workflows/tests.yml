name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Mirrors the `pgsql` service in compose.yaml — same image, same
    # credentials. ADR 0004: every test that persists runs on PostgreSQL
    # with pgvector, and SQLite does not substitute the contract. Without
    # this service the job died in `migrate` and never reached the checks.
    services:
      pgsql:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: wacrm
          POSTGRES_USER: wacrm
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -d wacrm -U wacrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Only DB_HOST is overridden. Sail resolves `pgsql` on its own docker
    # network; here the service port is published onto the runner. Every
    # other DB_* value already matches in .env.example, and a real env var
    # would silently outrank phpunit.xml's `<env name="DB_DATABASE"
    # value="testing"/>` — it has no force attribute, so the suite would
    # run against the development database instead.
    env:
      DB_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # Matches the Sail runtime. composer.lock pins symfony/* 8.1, which
          # requires >= 8.4.1, so 8.3 cannot install the lockfile at all.
          php-version: '8.4'
          # sockets is not optional: pest-plugin-browser's terminate hook
          # calls socket_create_listen() at the end of EVERY run, browser
          # suite or not, so without it the whole suite exits non-zero.
          extensions: pdo_pgsql, pgsql, sockets
          tools: composer:v2
          coverage: pcov

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The repo is pnpm-only (pnpm-lock.yaml, pnpm-workspace.yaml, no
      # package-lock.json). `npm install` would resolve fresh and ignore
      # the lockfile, so CI would not test what developers run.
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Sail seeds this through create-testing-database.sql at container
      # init; phpunit.xml points DB_DATABASE at it. RefreshDatabase
      # migrates but never creates, so the database has to exist first.
      # The timeouts mirror docker/postgres/init.sql. Without them a query
      # blocked on a lock waits forever, so a wedged run burns the job's
      # whole time budget instead of failing in seconds with a real error.
      - name: Create testing database
        env:
          PGPASSWORD: secret
        run: |
          psql -h localhost -U wacrm -d wacrm -c 'CREATE DATABASE testing'
          psql -h localhost -U wacrm -d wacrm -c "ALTER ROLE wacrm SET lock_timeout = '10s'"
          psql -h localhost -U wacrm -d wacrm -c "ALTER ROLE wacrm SET idle_in_transaction_session_timeout = '120s'"

      # Migrated up front rather than left to whichever RefreshDatabase
      # test runs first: the Unit suite touches tables without that trait.
      # The `vector` extension is created by the ai_tables migration
      # itself, on whichever database it runs against.
      - name: Migrate testing database
        env:
          DB_DATABASE: testing
        run: php artisan migrate --force

      # Feature tests render the Inertia root view, which resolves the Vite
      # manifest — without a build they fail on a missing manifest.
      - name: Build assets
        run: pnpm build

      # Static checks, the ADR 0001 layer lint, Vitest, and the PHP suites
      # minus Browser. ADR 0004 keeps Browser as its own gate, run by the
      # `browser` job below.
      - name: Run CI checks
        run: composer ci:check

      - name: Enforce PHP coverage and CRAP budgets
        env:
          PHP_COVERAGE_BASELINE_REF: origin/${{ github.base_ref || 'develop' }}
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref || 'develop' }} || true
          composer quality:php

      - name: Verify PHP quality gate regressions fail
        run: composer quality:php:verify

      - name: Upload PHP quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-quality-reports
          path: reports/php/
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    # The suite used to wedge instead of finishing (run 31146187705 sat there
    # for 6h). The trigger is fixed (#97) and the suite now runs in ~1min, but
    # the cap stays: a browser action that misses its 1s attempt makes
    # pest-plugin-browser's websocket client wait forever, so this is the only
    # thing that turns a future wedge into a readable log.
    timeout-minutes: 20

    # Independent of the `ci` job's service: each job gets its own runner
    # and network, so it needs its own Postgres+pgvector instance too.
    services:
      pgsql:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: wacrm
          POSTGRES_USER: wacrm
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -d wacrm -U wacrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, sockets
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # pest-plugin-browser drives Chrome through Playwright's own server
      # (node_modules/.bin/playwright run-server), so only the Chromium
      # binary + its OS deps need installing — not the full browser matrix.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The timeouts mirror docker/postgres/init.sql. Without them a query
      # blocked on a lock waits forever, so a wedged run burns the job's
      # whole time budget instead of failing in seconds with a real error.
      - name: Create testing database
        env:
          PGPASSWORD: secret
        run: |
          psql -h localhost -U wacrm -d wacrm -c 'CREATE DATABASE testing'
          psql -h localhost -U wacrm -d wacrm -c "ALTER ROLE wacrm SET lock_timeout = '10s'"
          psql -h localhost -U wacrm -d wacrm -c "ALTER ROLE wacrm SET idle_in_transaction_session_timeout = '120s'"

      - name: Migrate testing database
        env:
          DB_DATABASE: testing
        run: php artisan migrate --force

      # The Browser suite renders the app through Laravel's own kernel
      # (no `artisan serve`), but still resolves the Vite manifest for
      # assets — same reason the `ci` job builds before testing.
      - name: Build assets
        run: pnpm build

      - name: Run Browser suite
        run: composer test:browser
