# Fase 1 del plan de migración (docs/migration-laravel13-docker.md).
# Dev: el código se monta como volumen; vendor/ y node_modules/ se instalan en el host.
# Assets: `pnpm dev` (Vite) corre en el host, no en un contenedor.
# ponytail: uid 1000 hardcodeado (dueño del repo); parametrizar con args si otro dev lo usa.

x-app: &app
  build: .
  image: wacrm-laravel
  user: "1000:1000"
  volumes:
    - .:/var/www
  environment:
    APP_ENV: local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: wacrm
      POSTGRES_USER: wacrm
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"   # 5432 del host ya lo usa otro Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wacrm -d wacrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"

  queue:
    <<: *app
    command: php artisan queue:work --tries=3

  scheduler:
    <<: *app
    command: php artisan schedule:work

volumes:
  pgdata:
  redisdata:
